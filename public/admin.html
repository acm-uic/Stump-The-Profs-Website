<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin · Stump the Profs</title>
  <meta name="description" content="Host controls for Stump the Profs.">
  <link rel="preload" href="/fonts/clash-display-600.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="shell">
    <h1 class="wordmark">Host controls</h1>
    <p class="connection" id="connection">Connecting…</p>
  </header>

  <div class="admin-main">
    <form id="login" class="clay" hidden>
      <h2>Enter the admin key.</h2>
      <input id="key" type="password" autocomplete="current-password" aria-label="Admin key">
      <button type="submit" class="btn btn-primary">Sign in</button>
      <p class="error" id="login-error"></p>
    </form>

    <div class="layout" id="panel" hidden>
      <main>
        <p class="host-status"><span class="phase" id="phase"></span><span id="progress"></span><span id="countdown"></span></p>
        <div class="question clay" id="question"></div>
        <p class="answer-box" id="answer-box" hidden>Answer: <strong id="answer"></strong></p>
        <div class="host-notes">
          <p id="floor"></p>
          <p id="up-next"></p>
          <p class="result" id="result"></p>
        </div>

        <div class="controls">
          <button type="button" id="show">Show next question<kbd>N</kbd></button>
          <button type="button" id="open">Open answers<kbd>O</kbd></button>
          <button type="button" id="next">Read next answer<kbd>A</kbd></button>
          <button type="button" id="correct">Correct<kbd>C</kbd></button>
          <button type="button" id="wrong">Wrong<kbd>W</kbd></button>
          <button type="button" id="reveal">Reveal answer<kbd>R</kbd></button>
        </div>
        <p id="message"></p>

        <section class="panel">
          <h2>Sealed answers <small id="lockin-value"></small></h2>
          <ol class="teams answers" id="answers"></ol>
        </section>
      </main>

      <aside>
        <div class="tools">
          <button type="button" id="undo">Undo<kbd>Z</kbd></button>
          <button type="button" id="registration"></button>
          <button type="button" id="reset">Reset game…</button>
          <button type="button" id="export">Export backup</button>
          <label class="upload">Upload questions… <input id="upload" type="file" accept=".json,application/json"></label>
        </div>
        <p id="tool-message"></p>
        <section class="panel clay music-panel">
          <h2>Music</h2>
          <form id="music-form">
            <input id="music-link" type="url" placeholder="YouTube link for background music" aria-label="Background music link" autocomplete="off">
            <button type="submit" class="btn">Set</button>
          </form>
          <div class="music-controls">
            <button type="button" id="music-toggle" class="btn">Play</button>
            <label class="volume">Volume <input id="music-volume" type="range" min="0" max="100" step="5"></label>
          </div>
          <p class="music-now" id="music-now"></p>
          <p class="error" id="music-message"></p>
        </section>
        <section class="panel clay">
          <h2>Teams</h2>
          <div id="teams"></div>
        </section>
        <section class="panel">
          <h2>Questions</h2>
          <ol id="question-list"></ol>
        </section>
      </aside>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script type="module" src="/admin.js"></script>
</body>
</html>
