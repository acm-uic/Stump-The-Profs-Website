<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Display · Stump the Profs</title>
  <meta name="description" content="Follow Stump the Profs live, predict who gets each question and cheer for your side.">
  <link rel="preload" href="/fonts/clash-display-600.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/style.css">
</head>
<body class="display">
  <header class="shell topbar">
    <h1 class="wordmark">Stump the Profs</h1>
    <span class="phase-group"><span class="phase" id="phase"></span><span class="progress" id="progress"></span></span>
    <span class="join" id="join"></span>
  </header>
  <p class="connection" id="connection">Connecting…</p>

  <main class="display-main">
    <section class="stage">
      <p class="waiting" id="waiting">Waiting for the first question…</p>
      <div class="question clay" id="question"></div>
      <div class="result-banner" id="result" hidden></div>
      <div class="floor" id="floor-box" hidden>
        <span class="floor-name" id="floor"></span><span id="countdown"></span>
        <div class="bar"><div id="countdown-bar"></div></div>
      </div>
      <p id="up-next"></p>
      <p id="lockin-line"></p>
      <ul class="buzzes" id="buzzes"></ul>

      <section class="crowd-panel clay" id="crowd-panel">
        <h2>Play along</h2>
        <form id="crowd-join">
          <input id="crowd-name" type="text" maxlength="20" placeholder="Pick a nickname" aria-label="Nickname" autocomplete="off">
          <button type="submit" class="btn btn-primary">Join</button>
        </form>
        <div id="crowd-controls" hidden>
          <p class="me" id="crowd-me"></p>
          <div id="predict-box">
            <div>Who gets this one?</div>
            <div class="row" id="predict-row">
              <button type="button" data-side="student">Students</button>
              <button type="button" data-side="prof">Profs</button>
              <button type="button" data-side="none">Nobody</button>
            </div>
          </div>
          <div id="pick-box">
            <div>Your answer:</div>
            <div class="row" id="pick-row"></div>
          </div>
          <p class="feedback" id="crowd-feedback"></p>
          <div>Cheer for your side!</div>
          <div class="row cheer-row">
            <button type="button" class="s" data-cheer="student">Go Students!</button>
            <button type="button" class="p" data-cheer="prof">Go Profs!</button>
          </div>
        </div>
        <p class="error" id="crowd-error"></p>
      </section>
    </section>

    <section class="board clay">
      <div class="totals">
        <div class="s">Students<span class="num" id="total-students">0</span></div>
        <div class="p">Professors<span class="num" id="total-profs">0</span></div>
      </div>
      <div class="tug"><div class="s" id="tug-s"></div><div class="p" id="tug-p"></div></div>
      <div class="sides">
        <ul class="teams" id="students"></ul>
        <ul class="teams" id="profs"></ul>
      </div>

      <div class="crowd-board">
        <h3>Cheer meter</h3>
        <div class="meter"><div class="s" id="cheer-s"></div><div class="p" id="cheer-p"></div></div>
        <h3 id="predict-title">Crowd predictions</h3>
        <div class="meter"><div class="s" id="pred-s"></div><div class="p" id="pred-p"></div><div class="n" id="pred-n"></div></div>
        <div class="label"><span id="pred-s-label"></span><span id="pred-n-label"></span><span id="pred-p-label"></span></div>
        <h3 id="crowd-top-title">Top of the crowd</h3>
        <ol id="crowd-top"></ol>
      </div>
    </section>
  </main>
  <p id="fullscreen-hint">Press F for full screen</p>

  <script src="/socket.io/socket.io.js"></script>
  <script type="module" src="/display.js"></script>
</body>
</html>
