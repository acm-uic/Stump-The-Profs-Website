<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Display · Stump the Profs</title>
  <link rel="stylesheet" href="/style.css">
  <style>
    body { max-width: 56rem; }
    .sides { display: grid; grid-template-columns: 1fr 1fr; gap: 2rem; }
    #floor { font-size: 1.5rem; font-weight: bold; }
    #countdown { font-size: 1.5rem; color: #d62828; margin-left: 0.5rem; }
    ol#buzzes { font-size: 1.25rem; }
    .gap { color: #888; font-size: 1rem; margin-left: 0.5rem; }
  </style>
</head>
<body>
  <h1>Stump the Profs</h1>
  <p class="connection" id="connection">Connecting…</p>

  <p><span class="phase" id="phase"></span> <span id="progress"></span></p>
  <div id="question"></div>
  <p class="result" id="result"></p>
  <p><span id="floor"></span><span id="countdown"></span></p>
  <p id="up-next"></p>

  <h2>Buzzes</h2>
  <ol id="buzzes"></ol>

  <div class="sides">
    <section><h2>Students</h2><ul class="teams" id="students"></ul></section>
    <section><h2>Professors</h2><ul class="teams" id="profs"></ul></section>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script type="module" src="/display.js"></script>
</body>
</html>
