<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Player · Stump the Profs</title>
  <link rel="stylesheet" href="/style.css">
  <style>
    body { max-width: 32rem; text-align: center; }
    input[type="text"] { font-size: 1.25rem; padding: 0.5rem; width: 100%; box-sizing: border-box; }
    fieldset { border: none; margin: 1rem 0; font-size: 1.15rem; }
    label { margin: 0 0.75rem; }
    #register button { font-size: 1.25rem; padding: 0.6rem 1.5rem; }
    #error { color: #d62828; min-height: 1.5em; }
    #question { text-align: left; }
    #buzz { margin-top: 1rem; width: 100%; height: 10rem; font-size: 3rem; font-weight: bold;
            border: none; border-radius: 1rem; background: #d62828; color: white; cursor: pointer; }
    #buzz:disabled { background: #bbb; cursor: not-allowed; }
    #buzz:not(:disabled):active { transform: scale(0.97); }
    #status { font-size: 1.25rem; font-weight: 600; min-height: 1.5em; }
    #countdown { color: #d62828; }
    #lockin { margin-top: 1.5rem; padding: 1rem; border: 2px dashed #888; border-radius: 0.75rem; }
    #lockin h3 { margin: 0 0 0.25rem; }
    #lockin-options { display: grid; gap: 0.4rem; margin-top: 0.5rem; }
    #lockin-options button { font-size: 1.1rem; padding: 0.6rem; border-radius: 0.4rem; border: 1px solid #888; background: #f7f7f7; cursor: pointer; text-align: left; }
    #lockin-free { display: flex; gap: 0.4rem; }
    #lockin-free input { flex: 1; font-size: 1.1rem; padding: 0.5rem; }
    #lockin-free button { font-size: 1.1rem; padding: 0.5rem 1rem; }
    #lockin-result { font-weight: 600; }
    #lockin-error { color: #d62828; }
  </style>
</head>
<body>
  <h1>Stump the Profs</h1>
  <p class="connection" id="connection">Connecting…</p>

  <form id="register" hidden>
    <input id="team-name" type="text" placeholder="Team name" maxlength="30" autocomplete="off">
    <fieldset>
      <label><input type="radio" name="side" value="student"> Students</label>
      <label><input type="radio" name="side" value="prof"> Professors</label>
    </fieldset>
    <button type="submit">Join the game</button>
    <p id="error"></p>
  </form>

  <section id="play" hidden>
    <h2 id="team-label"></h2>
    <p>Score: <strong id="score">0</strong> · Rejoin code: <span class="code" id="code"></span></p>
    <p><span class="phase" id="phase"></span> <span id="countdown"></span></p>
    <div id="question"></div>
    <button id="buzz" disabled>BUZZ</button>
    <p id="status"></p>

    <section id="lockin" hidden>
      <h3>Lock in an answer</h3>
      <p><small>Not your turn? Lock in secretly for <strong id="lockin-points"></strong> points if you're right. One try. Closes when the first answer is judged.</small></p>
      <div id="lockin-options"></div>
      <form id="lockin-free" hidden>
        <input id="lockin-text" type="text" maxlength="80" placeholder="Your answer" autocomplete="off">
        <button type="submit">Lock in</button>
      </form>
      <p id="lockin-result"></p>
      <p id="lockin-error"></p>
    </section>
  </section>

  <script src="/socket.io/socket.io.js"></script>
  <script type="module" src="/player.js"></script>
</body>
</html>
